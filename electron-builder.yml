# electron-builder 配置：仅 Windows 目标
appId: com.colt.app
productName: Colt
copyright: Copyright © 2026 Colt

directories:
  output: release
  buildResources: build

# 只打包构建产物与运行时依赖；devDependencies 不会进包
files:
  - out/**/*
  - package.json
  # MIT 要求「所有副本或实质部分中保留版权与许可声明」，故随包分发（进 app.asar 根）
  - LICENSE

# pi 内核被 externalize，必须随包分发
asar: true
asarUnpack:
  - node_modules/@earendil-works/**

win:
  icon: build/icon.ico
  target:
    - target: nsis
      arch: [x64]
    - target: portable
      arch: [x64]
  artifactName: ${productName}-${version}-${arch}.${ext}

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Colt
  # 安装向导展示 MIT 许可全文（路径先按 build/ 找、再退回项目根，见 app-builder-lib 的 util/license.js）
  license: LICENSE
  # 自定义 NSIS 脚本：安装前检测历史安装（见 build/installer.nsh）
  include: build/installer.nsh
  installerLanguages:
    - zh_CN
  language: "2052"

portable:
  artifactName: ${productName}-${version}-portable.${ext}
