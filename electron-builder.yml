# electron-builder 配置：仅 Windows 目标
appId: com.banyan.app
productName: Banyan
copyright: Copyright © 2026 Banyan

directories:
  output: release
  buildResources: build

# 只打包构建产物与运行时依赖；devDependencies 不会进包
files:
  - out/**/*
  - package.json
  # 冒烟自检是开发期装置（src/main/smoke.ts，约 16KB），不随包分发。
  # 它由 main 动态 import 成独立 chunk，故按 chunk 名剔除；打包产物里
  # 不会再有该文件，入口的 !app.isPackaged 判断保证也不会去加载它。
  - "!out/main/chunks/smoke-*"

# pi 内核被 externalize，必须随包分发
asar: true
asarUnpack:
  - node_modules/@earendil-works/**

win:
  icon: build/icon.png
  target:
    - target: nsis
      arch: [x64]
    - target: portable
      arch: [x64]
  artifactName: ${productName}-${version}-${arch}.${ext}

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Banyan
  # 自定义 NSIS 脚本：安装前检测历史安装（见 build/installer.nsh）
  include: build/installer.nsh
  installerLanguages:
    - zh_CN
  language: "2052"

portable:
  artifactName: ${productName}-${version}-portable.${ext}
